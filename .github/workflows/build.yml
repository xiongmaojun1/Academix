name: Build Academix

on:
  push:
    branches: [ main-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'

    - name: Build Reasonix (with Academix)
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -ldflags="-s -w" -o bin/reasonix-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/reasonix

    - name: Build academix-extract
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -ldflags="-s -w" -o bin/academix-extract-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/academix-extract

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: reasonix-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          bin/*.exe
