name: Build Academix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Build Academix
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -ldflags="-s -w" -o bin/academix-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/academix

    - name: Create release archive
      run: |
        mkdir -p release/academix
        cp bin/academix-${{ matrix.goos }}-${{ matrix.goarch }} release/academix/
        cp SKILL.md release/academix/
        cp -r knowledge release/academix/
        cp -r workflows release/academix/
        cp -r assets release/academix/
        cp README.md release/academix/
        cd release && tar -czf academix-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz academix/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: academix-${{ matrix.goos }}-${{ matrix.goarch }}
        path: release/*.tar.gz
