name: Build Academix Extract

on:
  push:
    branches: [ main-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Download dependencies
      run: go mod download

    - name: Build academix-extract
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      run: |
        go build -ldflags="-s -w" -o bin/academix-extract-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/academix-extract

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: academix-extract-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/*
